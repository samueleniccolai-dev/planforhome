# The production stack: caddy (web bundle + TLS), server (Spring Boot), postgres.
# Every value comes from the .env next to this file (written by remote.sh, mode 600).
name: planforhome

services:
  caddy:
    image: ${IMAGE_WEB:?IMAGE_WEB is required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAB_BASE_DOMAIN: ${LAB_BASE_DOMAIN:?LAB_BASE_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

  server:
    image: ${IMAGE_SERVER:?IMAGE_SERVER is required}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/planforhome
      SPRING_DATASOURCE_USERNAME: planforhome
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?DEMO_PASSWORD is required}
      FCM_SERVICE_ACCOUNT_BASE64: ${FCM_SERVICE_ACCOUNT_BASE64:-}
    # The JRE image has neither curl nor wget: bash opens the socket itself (checked 2026-10-19).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/health HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # postgres:18, resolved 2026-10-19
    restart: unless-stopped
    environment:
      POSTGRES_DB: planforhome
      POSTGRES_USER: planforhome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # postgres 18 images keep the data in /var/lib/postgresql/18/docker: mount the parent (the image's VOLUME).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planforhome -d planforhome"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
