spring.application.name=planforhome
planforhome.git-sha=${GIT_SHA:unknown}
# Database settings come from the environment (SPRING_DATASOURCE_URL, _USERNAME, _PASSWORD).
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
server.shutdown=graceful
# Real client IP behind Caddy (rate limits). Demo data only when DEMO_PASSWORD is not empty.
server.forward-headers-strategy=native
planforhome.demo.password=${DEMO_PASSWORD:}
# Push (FCM HTTP v1). An empty secret turns the push off.
planforhome.fcm.service-account-base64=${FCM_SERVICE_ACCOUNT_BASE64:}
planforhome.fcm.base-url=https://fcm.googleapis.com
planforhome.fcm.timeout=PT10S
# Small pools that shrink when idle: many cached test contexts must fit in the connections of one Postgres.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
